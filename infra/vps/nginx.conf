# Edge do SAS em produção — serve o front estático e faz proxy da API na MESMA
# ORIGEM (docs/15 §Etapa 3 e 5). É o arranjo que mata três problemas de uma vez:
# o CORS deixa de existir, a URL da API vira caminho relativo, e o PostgREST
# some da internet.
#
# A imagem é a nginx-unprivileged (uid 101), que não pode escutar em porta
# < 1024: escuta 8080/8443 e o compose mapeia 80/443 do host.

# ── HTTP: só o desafio ACME e o redirect ─────────────────────────────────
server {
    listen 8080;
    server_name _;

    # Fica ANTES do redirect e nunca é redirecionado: a renovação do
    # certificado depende deste caminho responder em texto claro.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: o app ─────────────────────────────────────────────────────────
server {
    listen 8443 ssl;
    http2 on;
    server_name portalsas.online www.portalsas.online;

    # Cópias feitas pelo hook de deploy do certbot (infra/vps/renovar-tls.sh).
    # Não apontam para /etc/letsencrypt porque lá a chave privada é legível só
    # para root, e este nginx roda como uid 101.
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    # A planilha do Canvas passa fácil do default de 1 MB. Sem isto o upload
    # volta 413 com HTML de erro, o postArquivo tenta JSON.parse e a
    # coordenadora vê "POST /uploads → 413" (docs/14 §5, storage).
    client_max_body_size 25m;

    # ── Segurança ────────────────────────────────────────────────────────
    # HSTS deliberadamente CURTO (1 dia) no começo. HSTS é difícil de desfazer:
    # com um ano, qualquer problema de certificado tranca os usuários fora do
    # sistema pelo resto do prazo, porque o browser recusa o fallback para HTTP.
    # Subir para 31536000 depois de uma ou duas renovações bem-sucedidas.
    add_header Strict-Transport-Security "max-age=86400" always;

    # Sem CSP, um XSS futuro vira roubo de sessão: o token vive em
    # sessionStorage.
    #
    # Sem 'unsafe-inline' em script-src. Em estilo, a distinção é fina e vale
    # ser lida antes de mexer:
    #
    #   style-src 'self'                 → folha e <style> só do nosso domínio
    #   style-src-attr 'unsafe-inline'   → atributo style="" é permitido
    #
    # O único script inline era o guard de sessão do index.html, que virou
    # rota protegida em React; o build do Vite não injeta outro (conferido em
    # web/dist/index.html).
    #
    # O atributo style="" tinha saído junto com o login.html, e voltou em
    # 01/09/2026 por causa do KaTeX: ele posiciona fração, raiz e delimitador
    # medindo cada caixa e escrevendo a altura em style="" — 43 atributos numa
    # fórmula média. Não é opcional nem contornável (a medida é por fórmula,
    # não cabe em classe), e sem isso a resolução das questões chega ao aluno
    # com as frações desalinhadas. Por que style-src-attr e não afrouxar
    # style-src inteiro: assim segue proibido injetar <style> ou <link> — que
    # é o vetor que importa —, e libera-se só o atributo. O front não renderiza
    # HTML de terceiro em lugar nenhum (o Markdown do produto não tem HTML na
    # gramática, de propósito), então não há caminho de conteúdo externo até
    # esse atributo.
    #
    # O único host externo em toda a política, e só para imagem: os PNGs das
    # questões do banco ITA·IME (docs/22). É bucket da conta própria do projeto —
    # a mesma que já roda SES e EventBridge —, então não entra parte nova na
    # cadeia de dados de menores (CLAUDE.md, regra 6). Sem esta origem, o cartão
    # de questão cai para o texto do enunciado e o PDF exportado sai sem figura.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob: https://ita-por-assunto.s3.us-east-1.amazonaws.com; style-src 'self'; style-src-attr 'unsafe-inline'; font-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    # A superfície da API não precisa estar publicada: /docs e /openapi.json
    # entregam as ~50 rotas e os schemas de corpo a qualquer visitante
    # (docs/14 §5). O FastAPI também os desliga fora de dev (main.py) — as duas
    # camadas são de propósito: esta protege mesmo com a API exposta por
    # engano, a de lá protege mesmo sem o nginx na frente.
    location ~ ^/api/(docs|redoc|openapi\.json) {
        return 404;
    }

    # ── API ──────────────────────────────────────────────────────────────
    # A barra final em proxy_pass tira o /api do caminho: /api/alunos vira
    # /alunos no FastAPI. Quem recompõe o prefixo nos links gerados é o
    # --root-path=/api do uvicorn.
    location /api/ {
        proxy_pass http://api:8000/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # SOBRESCREVE em vez de acrescentar ($proxy_add_x_forwarded_for). Com
        # append, um cliente manda o próprio X-Forwarded-For e falseia o IP,
        # burlando o rate limit de login.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;

        # O chat responde por SSE. Com buffering ligado (default), o nginx
        # segura a resposta inteira e o streaming não acontece — a bolha fica
        # em "Enviando..." até o fim (docs/14 §5, frontend).
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Uma volta de tool calling do chat passa de 60s com folga.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── MCP da coordenação e os metadados do OAuth (docs/43 §10) ─────────
    # Sem estas locations, /mcp e os quatro /.well-known caíam no `location /`
    # e voltavam o index.html do SPA com 200: a IA recebia HTML no lugar de
    # JSON-RPC, e o conector, no lugar do metadado.
    #
    # O mcp é DESLIGADO por padrão (profile `mcp` no docker-compose.yml): na
    # maior parte do tempo o nome não existe na rede. Por isso o proxy_pass é
    # por VARIÁVEL, com o resolver do Docker — o nome se resolve na hora da
    # requisição, não no boot, e o nginx sobe com o mcp parado. Com nome fixo,
    # o nginx inteiro recusaria subir ("host not found in upstream"), e o site
    # cairia junto. Sem URI no proxy_pass, a URI original passa inteira, como
    # as rotas esperam.
    #
    # ⚠️ A variável só pergunta ao resolver porque NENHUM proxy_pass de nome
    # fixo usa mcp:8000. Com o mesmo host:porta de um upstream estático, o nginx
    # usa o upstream e nunca o resolver — foi o que a revisão de 27/10 achou no
    # `set $api` que estas locations tiveram (docs/43 §10.7). Por isso as duas
    # do RFC 8414, abaixo, são de nome fixo, como o `location /api/`.
    #
    # `valid=30s`: ligado o mcp, o nginx pode levar até 30 s para trocar o "não
    # existe" guardado pelo endereço. `resolver_timeout`: desligado, o DNS do
    # Docker repassa a pergunta para fora da rede, e o padrão de 30 s seguraria
    # a requisição esse tempo todo antes do 503.
    #
    # Sem `add_header` em NENHUMA destas: um add_header dentro de location
    # anula todos os do server — o CSP com frame-ancestors 'none' e o
    # X-Frame-Options DENY, que protegem a tela de consentimento /conectar-ia
    # de clickjacking (docs/15 §9.3).
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    location = /mcp {
        set $mcp http://mcp:8000;
        proxy_pass $mcp;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # SOBRESCREVE, não acrescenta: com MCP_IPS_DO_PROXY='*' o uvicorn do
        # mcp confia na entrada mais à esquerda, e é dela que saem o IP da
        # auditoria e o teto por IP. Os proxy_set_header do `location /api/`
        # não são herdados aqui.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Conectar dentro da rede do Docker leva menos de um milissegundo. 3 s
        # é para o mcp caído com o IP ainda no cache do resolver (até 30 s): o
        # SYN vai para um endereço que ninguém atende, e com o padrão de 60 s a
        # requisição ficava pendurada de 14 a 60 s (revisão de 27/10).
        proxy_connect_timeout 3s;
        # 502 e 504 são o que o NGINX gera quando o nome não resolve, ninguém
        # atende ou ninguém responde: o mcp desligado, subindo, caído ou
        # travado. Viram o 503 curto lá de baixo, e não a página de erro crua.
        # O 504 por leitura (os 300 s acima) também é travado, e não tool
        # lenta: o despacho abandona a tool no prazo dela e responde, e as 31
        # expostas têm o prazo padrão, 90 s (PRAZO_PADRAO_S em
        # app/chat/ferramentas.py; docs/43 §4.2). Uma tool exposta com prazo
        # perto do teto de 300 s que o registro aceita (PRAZO_MAXIMO_S) tira
        # o 504 daqui. O 401 e os erros do PRÓPRIO mcp passam como vieram
        # (sem proxy_intercept_errors).
        error_page 502 504 = @mcp_fora_do_ar;
    }

    # RFC 9728 — o mcp publica nos dois caminhos. Os mesmos 3 s e o mesmo 503
    # do /mcp, pelo mesmo motivo.
    location = /.well-known/oauth-protected-resource {
        set $mcp http://mcp:8000;
        proxy_pass $mcp;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        error_page 502 504 = @mcp_fora_do_ar;
    }
    location = /.well-known/oauth-protected-resource/mcp {
        set $mcp http://mcp:8000;
        proxy_pass $mcp;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        error_page 502 504 = @mcp_fora_do_ar;
    }

    # RFC 8414 — a API publica na raiz e com o caminho do emissor (/api). Vão
    # à api SEM tirar prefixo: proxy_pass sem URI passa o caminho inteiro, e
    # as rotas são estas mesmas. Nome FIXO, como o `location /api/`, e o
    # mesmo upstream dele: o nginx resolve `api` no boot e de novo só num
    # reload — que o deploy.sh faz a cada deploy, depois do `up -d`, porque o
    # api recriado pode voltar com outro IP (docs/43 §10.2). Com o OAuth
    # desligado (sem MCP_EMISSOR_OAUTH no .env), a API responde 404 em JSON.
    location = /.well-known/oauth-authorization-server {
        proxy_pass http://api:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /.well-known/oauth-authorization-server/api {
        proxy_pass http://api:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # O 503 de quando o mcp não está no ar. Texto curto, sem dizer se está
    # desligado, caído ou travado — daqui não dá para saber; quem sabe é o
    # servidor (`deploy.sh --verificar` pergunta ao compose). Leva os headers
    # de segurança do server, como toda resposta: nada de add_header aqui.
    location @mcp_fora_do_ar {
        default_type text/plain;
        charset utf-8;
        return 503 "O MCP da coordenação não está no ar neste servidor.\n";
    }

    # ── Front estático ───────────────────────────────────────────────────
    # Tudo que o build do Vite gera (JS, CSS, fontes, imagens) sai com hash no
    # nome e mora em /assets/. Sob o mesmo nome o conteúdo nunca muda, então
    # cacheia por um ano; um deploy publica nomes novos e o browser busca
    # sozinho. Antes do build step NADA tinha hash, e por isso nada podia ser
    # cacheado (docs/14 §10).
    #
    # `^~` porque locations regex vencem locations de prefixo — sem ele, a
    # regex de .html abaixo capturaria os assets. `=404` em vez do fallback:
    # asset que não existe tem que dar 404 honesto.
    #
    # Só `expires`, sem `add_header Cache-Control "immutable"`: um add_header
    # dentro de um location ANULA todos os add_header herdados do server, o
    # que apagaria em silêncio a CSP e o HSTS acima. Vale mais preservar os
    # headers de segurança do que ganhar o `immutable`.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # Programas para baixar (hoje: o AutoSwift OBS, card da Administração).
    # Moram FORA da imagem — são ~160 MB de .exe que trocam sem deploy do site
    # —, num bind mount (como trocar: o volume em docker-compose.yml). `^~`
    # pelo mesmo motivo de /assets/, e `=404` para que arquivo ausente não
    # devolva o index.html do fallback com status 200 (o browser salvaria HTML
    # como se fosse .zip).
    # Sem `add_header` aqui, para não anular os de segurança do server.
    location ^~ /downloads/ {
        alias /srv/downloads/;
        try_files $uri =404;
        expires -1;
    }

    # Roteamento por caminho real (`/alunos/A023`, não mais `#/alunos/A023`):
    # caminho que não é arquivo cai no index.html e o React Router resolve.
    #
    # O fallback era proibido enquanto os ES modules iam crus: um .js quebrado
    # voltaria HTML com status 200 e o erro no browser viraria "Unexpected
    # token '<'" (docs/14 §5). Deixou de ser risco porque todo asset real está
    # sob /assets/, servido pela regra acima, que responde 404 de verdade.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Antes da migração para React o login era uma página HTML própria. Um
    # match exato, e não um fallback no bloco `.html` abaixo: com fallback,
    # QUALQUER .html inexistente devolveria o app com status 200, que é
    # justamente o que as regras acima existem para evitar. 301 porque a
    # página mudou de endereço em definitivo.
    location = /login.html {
        return 301 /login;
    }

    # O HTML é o único arquivo sem hash no nome. Cacheá-lo prenderia o usuário
    # numa versão antiga, apontando para assets que já não existem.
    location ~* \.html$ {
        expires -1;
    }

    location ~* ^/(Dockerfile|nginx\.conf|\.dockerignore|README\.md)$ {
        return 404;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
