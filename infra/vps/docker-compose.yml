# Stack de produção do SAS — VPS único (docs/15-plano-hospedagem-vps.md §Etapa 3).
#
# AUTÔNOMO de propósito: não é override do docker-compose.yml da raiz, que é de
# desenvolvimento (bind mount do código, --reload, portas publicadas). Assim
# ninguém sobe produção com config de dev por esquecer um `-f`.
#
#   cd /opt/sas/infra/vps
#   docker compose up -d --build
#
# A REGRA que sustenta a segurança desta stack: só `web` tem `ports:`. O Docker
# escreve no iptables direto e passa POR CIMA do ufw, então publicar a porta do
# `postgrest` ou do `db` os exporia na internet mesmo com o firewall fechado —
# e o papel anônimo do PostgREST tem acesso total ao schema (docs/14 §5).

name: sas

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      POSTGRES_DB: sas
      POSTGREST_PASSWORD: ${POSTGREST_PASSWORD:?defina no .env}
      TZ: ${TZ:-America/Fortaleza}
      # Collation explícita: a imagem alpine usa musl e só oferece locale C, que
      # ordena por byte — "Ávila" cairia no fim da lista de alunos. Só vale na
      # criação do volume; num banco já existente é ignorado (docs/14 §5.1).
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=pt-BR --locale=C.UTF-8"
    volumes:
      - db-dados:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sas"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgrest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGREST_PASSWORD:?}@db:5432/sas
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: sas_service
      PGRST_DB_POOL: "10"
      PGRST_SERVER_PORT: "3000"
      TZ: ${TZ:-America/Fortaleza}
      # PGRST_DB_MAX_ROWS deliberadamente NÃO definido. O teto de 1000 linhas
      # era config do Supabase, não do PostgREST — e o backend não pagina em
      # lugar nenhum (docs/14 §10). Um teto aqui truncaria leituras em silêncio
      # e as estatísticas ficariam erradas sem erro. Dívida conhecida: paginar
      # `nota`, `v_nota_dimensoes` e `questao_resposta_aluno` antes de crescer.

  api:
    build:
      context: ../../api
      target: prod
    restart: unless-stopped
    depends_on:
      - postgrest
    env_file: .env
    environment:
      APP_ENV: production
      POSTGREST_URL: http://postgrest:3000
      STORAGE_DIR: /dados/storage
      TZ: ${TZ:-America/Fortaleza}
      # Sem CORS: front e API na mesma origem, atrás do mesmo nginx.
      CORS_ALLOW_ORIGINS: ""
    volumes:
      # Bind mount, não volume nomeado: o dono precisa ser o uid 10001 do
      # usuário `sas` da imagem, e um volume nomeado nasce root. Também torna
      # backup e inspeção dos PDFs triviais. Criado por 00-prep-root.sh.
      - /opt/sas/dados/storage:/dados/storage
    command:
      - sh
      - -c
      # --root-path: a API é publicada sob /api pelo nginx. Sem isso o FastAPI
      #   monta redirects e openapi.json com caminho errado (docs/14 §2).
      # --proxy-headers + --forwarded-allow-ips: sem eles request.client.host
      #   vira o IP do nginx para todo mundo e o rate limit de login colapsa
      #   numa chave só (docs/14 §6.1). O `*` é seguro AQUI porque a API não
      #   tem porta publicada — só o nginx a alcança, e ele sobrescreve o
      #   X-Forwarded-For em vez de acrescentar.
      - >
        uvicorn app.main:app
        --host 0.0.0.0 --port 8000
        --workers ${UVICORN_WORKERS:-1}
        --root-path /api
        --proxy-headers --forwarded-allow-ips='*'

  web:
    # Imagem construída (e não mais `image:` + bind mount do código): o front
    # passou a ter build step com o Vite, então o que o nginx serve é
    # `web/dist`, gerado aqui dentro. O estágio final continua sendo a
    # nginx-unprivileged — a oficial sobe o master como root (docs/14 §5) — e
    # continua escutando 8080/8443, com o host mapeando 80/443.
    #
    # O `docker compose build` do deploy.sh passa a construir o front junto:
    # do ponto de vista de quem opera, o fluxo de deploy não muda.
    build:
      context: ../../web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      # O nginx.conf da borda (TLS + proxy da API) sobrescreve o que veio na
      # imagem, que só sabe servir o front isolado.
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Desafio ACME (escrito pelo certbot no host, lido pelo nginx) e cópia
      # dos certificados. A cópia existe porque /etc/letsencrypt guarda a chave
      # privada só para root, e esta imagem roda como uid 101 — o hook de
      # deploy do certbot copia com o dono certo (infra/vps/renovar-tls.sh).
      - /opt/sas/dados/acme:/var/www/certbot:ro
      - /opt/sas/dados/tls:/etc/nginx/tls:ro
    environment:
      TZ: ${TZ:-America/Fortaleza}

  # One-shot, não sobe com `up`. Mesma imagem da API (precisa de psycopg e de
  # migrations/), mas conecta como dono do schema, não como o papel do PostgREST.
  #
  #   docker compose run --rm migrate up
  #   docker compose restart postgrest      ← obrigatório: o PostgREST cacheia
  #                                            o schema no boot (docs/14 §6.6)
  migrate:
    build:
      context: ../../api
      target: prod
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      APP_ENV: production
      TZ: ${TZ:-America/Fortaleza}
      SUPABASE_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD:?}@db:5432/sas
    entrypoint: ["python", "-m", "scripts.migrate"]
    command: ["status"]

volumes:
  db-dados:
