# Stack de produção do SAS — VPS único (docs/15-plano-hospedagem-vps.md §Etapa 3).
#
# AUTÔNOMO de propósito: não é override do docker-compose.yml da raiz, que é de
# desenvolvimento (bind mount do código, --reload, portas publicadas). Assim
# ninguém sobe produção com config de dev por esquecer um `-f`.
#
#   cd /opt/sas/infra/vps
#   docker compose up -d --build
#
# A REGRA que sustenta a segurança desta stack: só `web` tem `ports:`. O Docker
# escreve no iptables direto e passa POR CIMA do ufw, então publicar a porta do
# `postgrest` ou do `db` os exporia na internet mesmo com o firewall fechado —
# e o papel anônimo do PostgREST tem acesso total ao schema (docs/14 §5).

name: sas

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      POSTGRES_DB: sas
      POSTGREST_PASSWORD: ${POSTGREST_PASSWORD:?defina no .env}
      TZ: ${TZ:-America/Fortaleza}
      # Collation explícita: a imagem alpine usa musl e só oferece locale C, que
      # ordena por byte — "Ávila" cairia no fim da lista de alunos. Só vale na
      # criação do volume; num banco já existente é ignorado (docs/14 §5.1).
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=pt-BR --locale=C.UTF-8"
    volumes:
      - db-dados:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sas"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgrest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGREST_PASSWORD:?}@db:5432/sas
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: sas_service
      PGRST_DB_POOL: "10"
      PGRST_SERVER_PORT: "3000"
      TZ: ${TZ:-America/Fortaleza}
      # PGRST_DB_MAX_ROWS deliberadamente NÃO definido. O teto de 1000 linhas
      # era config do Supabase, não do PostgREST — e o backend não pagina em
      # lugar nenhum (docs/14 §10). Um teto aqui truncaria leituras em silêncio
      # e as estatísticas ficariam erradas sem erro. Dívida conhecida: paginar
      # `nota`, `v_nota_dimensoes` e `questao_resposta_aluno` antes de crescer.

  api:
    build:
      context: ../../api
      target: prod
    restart: unless-stopped
    depends_on:
      - postgrest
    env_file: .env
    environment:
      APP_ENV: production
      POSTGREST_URL: http://postgrest:3000
      STORAGE_DIR: /dados/storage
      TZ: ${TZ:-America/Fortaleza}
      # Sem CORS: front e API na mesma origem, atrás do mesmo nginx.
      CORS_ALLOW_ORIGINS: ""
    volumes:
      # Bind mount, não volume nomeado: o dono precisa ser o uid 10001 do
      # usuário `sas` da imagem, e um volume nomeado nasce root. Também torna
      # backup e inspeção dos PDFs triviais. Criado por 00-prep-root.sh.
      - /opt/sas/dados/storage:/dados/storage
    command:
      - sh
      - -c
      # --root-path: a API é publicada sob /api pelo nginx. Sem isso o FastAPI
      #   monta redirects e openapi.json com caminho errado (docs/14 §2).
      # --proxy-headers + --forwarded-allow-ips: sem eles request.client.host
      #   vira o IP do nginx para todo mundo e o rate limit de login colapsa
      #   numa chave só (docs/14 §6.1). O `*` é seguro AQUI porque a API não
      #   tem porta publicada — só o nginx a alcança, e ele sobrescreve o
      #   X-Forwarded-For em vez de acrescentar.
      - >
        uvicorn app.main:app
        --host 0.0.0.0 --port 8000
        --workers ${UVICORN_WORKERS:-1}
        --root-path /api
        --proxy-headers --forwarded-allow-ips='*'

  web:
    # Imagem construída (e não mais `image:` + bind mount do código): o front
    # passou a ter build step com o Vite, então o que o nginx serve é
    # `web/dist`, gerado aqui dentro. O estágio final continua sendo a
    # nginx-unprivileged — a oficial sobe o master como root (docs/14 §5) — e
    # continua escutando 8080/8443, com o host mapeando 80/443.
    #
    # O `docker compose build` do deploy.sh passa a construir o front junto:
    # do ponto de vista de quem opera, o fluxo de deploy não muda.
    build:
      context: ../../web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      # O nginx.conf da borda (TLS + proxy da API) sobrescreve o que veio na
      # imagem, que só sabe servir o front isolado.
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Desafio ACME (escrito pelo certbot no host, lido pelo nginx) e cópia
      # dos certificados. A cópia existe porque /etc/letsencrypt guarda a chave
      # privada só para root, e esta imagem roda como uid 101 — o hook de
      # deploy do certbot copia com o dono certo (infra/vps/renovar-tls.sh).
      - /opt/sas/dados/acme:/var/www/certbot:ro
      - /opt/sas/dados/tls:/etc/nginx/tls:ro
      # Programas para baixar (/downloads/, card da Administração). Fica fora
      # da imagem: o zip do AutoSwift OBS troca sem rebuild.
      #
      # `scp` direto NÃO basta: a pasta é do uid 101 (este nginx), e o usuário
      # `sas` não escreve nela nem tem sudo sem senha. O caminho é mandar para
      # uma pasta de espera e gravar como 101 — nome temporário e `mv`, para
      # quem baixar no meio da cópia não levar meio zip:
      #
      #   scp AutoSwift-OBS-Windows.zip sas@VPS:upload-downloads/
      #   docker run --rm --user 101:101 --network none --entrypoint sh \
      #     -v /opt/sas/dados/downloads:/d -v ~/upload-downloads:/src:ro \
      #     postgres:16-alpine -c 'cp /src/AutoSwift-OBS-Windows.zip /d/.novo \
      #       && chmod 644 /d/.novo && mv -f /d/.novo /d/AutoSwift-OBS-Windows.zip'
      #
      # O zip precisa ter `AutoSwift OBS.exe` e `_internal/` na RAIZ. Um zip
      # dentro de outro zip (o "Comprimir" do Finder sobre o artefato do CI)
      # leva o usuário a abrir o .exe de dentro do zip, que é o "Failed to load
      # Python DLL" que o tutorial existe para evitar.
      - /opt/sas/dados/downloads:/srv/downloads:ro
    environment:
      TZ: ${TZ:-America/Fortaleza}
    # `default` para alcançar a api; `borda_mcp` para alcançar o mcp, que não
    # está na rede da API (docs/43 §10). Com o MCP desligado a rede fica vazia
    # e o nginx responde 503 em /mcp: ele resolve o nome a cada requisição,
    # então sobe sem o mcp (nginx.conf).
    networks:
      - default
      - borda_mcp

  # One-shot, não sobe com `up`. Mesma imagem da API (precisa de psycopg e de
  # migrations/), mas conecta como dono do schema, não como o papel do PostgREST.
  #
  #   docker compose run --rm migrate up
  #   docker compose restart postgrest      ← obrigatório: o PostgREST cacheia
  #                                            o schema no boot (docs/14 §6.6)
  migrate:
    build:
      context: ../../api
      target: prod
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      APP_ENV: production
      TZ: ${TZ:-America/Fortaleza}
      SUPABASE_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD:?}@db:5432/sas
    entrypoint: ["python", "-m", "scripts.migrate"]
    command: ["status"]

  # ─── MCP da coordenação (docs/43 §5 e §10) — DESLIGADO ────────────────
  #
  # Os dois serviços ficam no profile `mcp` e NÃO sobem com o `up -d` do
  # deploy enquanto o .env não tiver COMPOSE_PROFILES=mcp. Ligar é o portão de
  # LGPD (docs/43 §5.4): só acrescentar as linhas ao .env e rodar o deploy — o
  # passo a passo está na §10. Desligado, nada aqui existe em produção: nem
  # container, nem senha no login (o autenticador_mcp segue com a PASSWORD
  # NULL da 0071).
  #
  # ⚠️ NENHUM `${X:?}` nestes dois serviços. O compose interpola o arquivo
  # INTEIRO antes de aplicar os profiles: um `:?` aqui, com a variável fora do
  # .env, quebra todo `docker compose` da stack — deploy, cron, `ps` — com o
  # MCP desligado (provado no Compose v5.2.0 em 27/10, docs/43 §10). Por isso
  # o padrão é o que falha fechado na hora de subir: senha vazia, que o login
  # recusa, e MCP_HABILITADO=false, que o guard de boot do mcp recusa.
  #
  # Nenhum dos dois tem `ports:` (armadilha 4): o anônimo do postgrest_mcp lê
  # a lista branca sem token, e o mcp devolve dado de menor.
  postgrest_mcp:
    image: postgrest/postgrest:v12.2.3
    profiles: ["mcp"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Login PRÓPRIO (0071), nunca o `authenticator` da API: ele é membro do
      # sas_service, e com ele um SET ROLE numa requisição do MCP, ou um
      # `pgrst.*` gravado no papel de login, levava ao acesso total (docs/43
      # §5.2). A senha nunca é escrita aqui: é a POSTGREST_MCP_PASSWORD do
      # .env, que o deploy.sh grava no login a cada deploy com o MCP ligado.
      # Sem ela, a URI vai sem senha e o Postgres recusa — o PostgREST sai e o
      # `restart` tenta de novo, sem entrar nunca.
      PGRST_DB_URI: postgres://autenticador_mcp:${POSTGREST_MCP_PASSWORD:-}@db:5432/sas
      PGRST_DB_SCHEMAS: public
      # sas_mcp (0071 e 0072): SELECT só na lista branca, por coluna; INSERT só
      # na auditoria; EXECUTE só em mcp_conferir_token.
      PGRST_DB_ANON_ROLE: sas_mcp
      # SEM PGRST_JWT_SECRET, de propósito: sem segredo, todo Bearer vira
      # PGRST300 e nenhum JWT, nem forjado, troca o papel. E sem a config
      # guardada no banco, que valeria POR CIMA deste env (segunda camada,
      # docs/43 §5.2). Não acrescente.
      PGRST_DB_CONFIG: "false"
      # Pool próprio e pequeno: o tráfego de uma IA de fora não disputa as 10
      # conexões do PostgREST da API. Com a do LISTEN são 4, abaixo do
      # CONNECTION LIMIT 10 do autenticador_mcp (0071).
      PGRST_DB_POOL: "3"
      PGRST_SERVER_PORT: "3000"
      TZ: ${TZ:-America/Fortaleza}
      # SEM PGRST_DB_MAX_ROWS, pelo mesmo motivo do `postgrest` (armadilha 2).
    networks:
      # `default` para alcançar o db; `dados_mcp` para o mcp alcançá-lo.
      - default
      - dados_mcp

  mcp:
    # A MESMA imagem da API, outro processo (docs/43 §5.1): `sas-api` é o nome
    # que o compose dá ao build do serviço `api` (`name: sas` + serviço). Sem
    # `build:` próprio de propósito. Com um, o `build` do deploy.sh — que roda
    # com `--profile tools`, e o `--profile` da linha de comando SUBSTITUI o
    # COMPOSE_PROFILES do .env — não o reconstruiria, e o `up -d` seguiria
    # subindo o código do primeiro deploy (o tropeço da 0021, docs/15 §Etapa
    # 7). Assim, imagem nova do `api` é imagem nova do `mcp`, e o `up -d`
    # recria os dois. `pull_policy: never`: este nome não existe em registro
    # nenhum, e o compose nunca deve sair perguntando por ele.
    image: sas-api
    pull_policy: never
    profiles: ["mcp"]
    restart: unless-stopped
    # O CMD da imagem é o uvicorn da API (api/Dockerfile). O HEALTHCHECK
    # herdado de lá chama 127.0.0.1:8000/health, e o app.mcp responde ali.
    command: ["python", "-m", "app.mcp"]
    depends_on:
      - postgrest_mcp
    # SEM env_file: o .env daqui é o da API (JWT_SECRET_KEY, OpenAI, Canvas,
    # AWS), e o guard de boot do mcp recusa subir com qualquer um deles. As
    # MCP_* vêm do MESMO .env por interpolação — a API lê as mesmas linhas
    # pelo env_file dela, e os dois processos ficam com o mesmo valor. Os
    # outros MCP_* do processo (limite por minuto, teto de linhas…) ficam no
    # padrão do código; mudar um deles pede a linha aqui, não só no .env.
    environment:
      APP_ENV: production
      TZ: ${TZ:-America/Fortaleza}
      # O PostgREST DELE. http://postgrest:3000 nem resolve daqui: o mcp não
      # está na rede default (ver `networks`).
      POSTGREST_URL: http://postgrest_mcp:3000
      # O portão de LGPD (docs/43 §5.4): fora do .env vale `false`, e o guard
      # recusa subir — o profile ativo sem a decisão não põe o MCP no ar.
      MCP_HABILITADO: ${MCP_HABILITADO:-false}
      # Vazias, o guard recusa a primeira e o OAuth fica desligado sem a
      # segunda; a §10 diz os valores.
      MCP_URL_PUBLICA: ${MCP_URL_PUBLICA:-}
      MCP_EMISSOR_OAUTH: ${MCP_EMISSOR_OAUTH:-}
      # Administrador E coordenador (decisão do dono, 26/10); `true` volta ao
      # só-administrador — e a API precisa do MESMO valor, que ela lê da mesma
      # linha do .env. Um `:-true` aqui desfaria a decisão no deploy.
      MCP_EMISSAO_SO_ADMINISTRADOR: ${MCP_EMISSAO_SO_ADMINISTRADOR:-false}
      # O nome real do aluno (decisão do dono, 26/10; pede a base legal do
      # art. 14 da LGPD). `false` volta ao pseudônimo. Só o mcp lê.
      MCP_MOSTRAR_NOME_DO_ALUNO: ${MCP_MOSTRAR_NOME_DO_ALUNO:-true}
      # Só o nginx alcança o mcp, e ele SOBRESCREVE o X-Forwarded-For
      # (nginx.conf, `location = /mcp`): é dele que saem o IP da auditoria e o
      # teto por IP.
      MCP_IPS_DO_PROXY: "*"
    networks:
      # Fora da rede default: daqui não se alcança o db, o `postgrest` da API
      # (anônimo = sas_service) nem a api. `borda_mcp` é por onde o nginx
      # chega; `dados_mcp`, por onde ele chega ao postgrest_mcp.
      - borda_mcp
      - dados_mcp

volumes:
  db-dados:

networks:
  # As duas do MCP (docs/43 §5.2 e §10). A `default` segue implícita, como
  # sempre foi: declará-la aqui não muda nada e só abre espaço para mudar.
  borda_mcp: {}   # nginx ↔ mcp
  dados_mcp: {}   # mcp ↔ postgrest_mcp
