# Frontend do SAS: HTML/CSS/JS servidos crus, sem build step.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Roteamento é por hash (`#/alunos/A023`, ver web/js/router.js), então
    # NÃO existe fallback pra index.html: um caminho inexistente tem que dar
    # 404 mesmo. Com fallback, um import de módulo quebrado receberia HTML
    # com status 200 e o erro no browser viraria um "Unexpected token '<'".
    location / {
        try_files $uri $uri/ =404;
    }

    # Os arquivos não têm hash no nome, então cachear HTML prenderia o
    # usuário numa versão antiga do app.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Em dev o diretório web/ inteiro é montado como volume, o que traria
    # junto os arquivos de build. Em produção o .dockerignore já os exclui.
    location ~* ^/(Dockerfile|nginx\.conf|\.dockerignore|README\.md)$ {
        return 404;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
