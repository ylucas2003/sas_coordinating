# Frontend do SAS servido a partir do build do Vite (`web/dist`).
#
# Este arquivo vale para a imagem isolada do front. Em produção quem está na
# borda é infra/vps/nginx.conf, que além disto faz TLS e o proxy da API.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Assets com hash no nome (`main-D55EXh_u.js`): o conteúdo nunca muda sob
    # o mesmo nome, então cacheia por um ano. É o inverso do que valia antes
    # do build step, quando nenhum arquivo tinha hash e cachear qualquer coisa
    # prendia o usuário numa versão antiga.
    #
    # `^~` para vencer a regex de HTML abaixo (locations regex têm prioridade
    # sobre prefixo, exceto com ^~). `=404` em vez do fallback: asset ausente
    # tem que dar 404 honesto, e não HTML com status 200.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Roteamento por caminho real (`/alunos/A023`): qualquer caminho que não
    # seja um arquivo cai no index.html e o React Router resolve. Seguro
    # porque todo asset de verdade mora em /assets/ e é servido pela regra
    # acima — nenhum módulo quebrado vira "Unexpected token '<'".
    location / {
        try_files $uri $uri/ /index.html;
    }

    # O HTML é a única coisa sem hash no nome: cacheá-lo prenderia o usuário
    # na versão antiga, que referencia assets que já não existem.
    location ~* \.html$ {
        expires -1;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
